[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qozy"
version = "0.1.0"
description = "QOZY: SPDC / Bell-test measurement GUI (PyQt6 + VisPy)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<2",
  "vispy>=0.14",
  "PyQt6>=6.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-qt>=4.4",
  "ruff>=0.6.0",
]
hardware = [
  # Swabian Instruments TimeTagger SDK is not on PyPI; install from the
  # vendor package for your OS/arch, then this extra is a no-op marker.
]

[project.scripts]
qozy = "qozy.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qozy = ["gui/icons/*"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
exclude = [
    "aux/",
]
