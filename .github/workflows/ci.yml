name: CI

on:
  push:
  pull_request:

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: ruff check
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: System libs for PyQt6 offscreen platform
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libxkbcommon0 libxcb-cursor0 libgl1
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Compile check
        run: uv run python -m compileall -q src/qozy tests
      - name: pytest
        run: uv run pytest -q
