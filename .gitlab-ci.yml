image: python:3.12-slim

stages:
  - check

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  QT_QPA_PLATFORM: "offscreen"

cache:
  paths:
    - .cache/uv

before_script:
  - pip install --upgrade pip -q
  - pip install uv -q
  - uv sync --extra dev

lint:
  stage: check
  script:
    - uv run ruff check .

test:
  stage: check
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends
        libegl1
        libfontconfig1
        libxkbcommon0
        libxcb-cursor0
        libgl1
        > /dev/null
    - pip install --upgrade pip -q
    - pip install uv -q
    - uv sync --extra dev
  script:
    - uv run pytest -q
