image: python:3.12-slim

stages:
  - lint
  - test

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  QT_QPA_PLATFORM: "offscreen"

cache:
  paths:
    - .cache/uv

before_script:
  # PyQt6's offscreen platform plugin needs a handful of shared libs that
  # aren't in python:3.12-slim by default.
  - apt-get update -qq && apt-get install -y -qq --no-install-recommends
      libegl1 libxkbcommon0 libxcb-cursor0 libgl1 > /dev/null
  - pip install --upgrade pip -q
  - pip install uv -q
  - uv sync --extra dev

lint:
  stage: lint
  script:
    - uv run ruff check .

test:
  stage: test
  script:
    - uv run python -m compileall -q src/qozy tests
    - uv run pytest -q
