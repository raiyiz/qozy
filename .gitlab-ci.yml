image: python:3.12-slim

stages:
  - check

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  QT_QPA_PLATFORM: "offscreen"

cache:
  paths:
    - .cache/uv

before_script:
  - pip install --upgrade pip -q
  - pip install uv -q
  - uv sync --extra dev

lint:
  stage: check
  script:
    - uv run ruff check .

test:
  stage: check
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends
        libegl1
        libfontconfig1
        libfreetype6
        libglib2.0-0
        libdbus-1-3
        libgl1
        libx11-6
        libx11-xcb1
        libxcb1
        libxcb-cursor0
        libxcb-icccm4
        libxcb-image0
        libxcb-keysyms1
        libxcb-render0
        libxcb-render-util0
        libxcb-shape0
        libxcb-shm0
        libxcb-sync1
        libxcb-xfixes0
        libxcb-xkb1
        libxext6
        libxfixes3
        libxi6
        libxkbcommon0
        libxkbcommon-x11-0
        libxrandr2
        libxrender1
        libsm6
        libice6
        > /dev/null
    - pip install --upgrade pip -q
    - pip install uv -q
    - uv sync --extra dev
  script:
    - uv run pytest -q
